# CineGrade - Docker Compose
#
# A környezetet a .env fájl APP_ENV sora választja ki (dev vagy prod),
# a beállítások a .env.dev / .env.prod fájlból jönnek.
#
# Fejlesztés (csak adatbázis + levelező; a Spring-et IntelliJ-ből, az Angulart `npm start`-tal futtatod):
#   docker compose up -d
#
# Teljes rendszer konténerekben (db + mailpit + backend + frontend):
#   docker compose --profile app up -d --build
#   -> http://localhost:8000
#
# Egyszeri futtatás másik környezettel (a .env módosítása nélkül), PowerShellben:
#   $env:APP_ENV="prod"; docker compose --profile app up -d --build; Remove-Item Env:APP_ENV
#
# Leállítás:            docker compose --profile app down
# Minden adat törlése:  docker compose --profile app down -v   (VIGYÁZAT: az adatbázis is törlődik!)

name: cinegrade

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD innen jön
    env_file: .env.${APP_ENV:-dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Csak a saját gépről érhető el (IntelliJ / DBeaver), a hálózatról nem
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kamu levelezőszerver: minden kiküldött e-mail itt látható -> http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # dev/prod profil + "docker" profil (az a konténeren belüli címeket állítja be)
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev},docker
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Csak localhoston; kifelé a Tailscale / Caddy teszi elérhetővé
      - "127.0.0.1:8000:80"
    mem_limit: 64m

volumes:
  # Külön adatbázis dev-hez és prod-hoz: a tesztadatok nem keverednek az éles adatokkal
  db-data:
    name: cinegrade_db_${APP_ENV:-dev}
