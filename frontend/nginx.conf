# A frontend konténer nginx beállítása.
# - /api/...  -> továbbítja a Spring backend konténernek
# - minden más -> az Angular app (index.html), hogy a routing működjön (pl. /login)

# Ha Caddy (https) van előttünk, az ő protokollját adjuk tovább, különben a sajátunkat
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Feltöltések (LUT, cgedit, képek) mérete
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A hash-elt nevű JS/CSS fájlok sokáig cache-elhetők
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
