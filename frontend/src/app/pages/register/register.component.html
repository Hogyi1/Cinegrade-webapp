<div class="container-fluid card login-container">
  <h3 class="text-center">Create an account</h3>
  <hr>
  <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
    <p *ngFor="let msg of errorMsg">{{msg}}</p>
  </div>
  <div class="mb-3">
    <label class="form-label" for="firstname">Firstname</label>
    <input [(ngModel)]="registerRequest.firstName" type="text" name="firstName" class="form-control" id="firstName" placeholder="Hogyor">
  </div>
  <div class="mb-3">
    <label class="form-label" for="lastName">Lastname</label>
    <input [(ngModel)]="registerRequest.lastName" type="lastName" name="lastName" class="form-control" id="lastName" placeholder="Péter">
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input [(ngModel)]="registerRequest.email" type="email" name="email" class="form-control" id="email" placeholder="example@mail.com">
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input [(ngModel)]="registerRequest.password" type="password" name="password" class="form-control" id="password" placeholder="secret1">
  </div>
  <div>
    <div class="d-flex justify-content-between mb-3">
      <button (click)="register()" type="button" class="btn btn-primary">
        <em class="fas fa-sign-in-alt">&nbsp;Register account</em>
      </button>
    </div>
    <div>
      Already have an account? &nbsp;
      <button (click)="login()" type="button" class="btn btn-link">
        <em class="fas fa-login-in-alt">&nbsp;Login</em>
      </button>
    </div>
  </div>
</div>
