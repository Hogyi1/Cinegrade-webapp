<div class="container-fluid card login-container">
  <h3 class="text-center">Login</h3>
  <hr>
  <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
    <p *ngFor="let msg of errorMsg">{{msg}}</p>
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email address</label>
    <input [(ngModel)]="authRequest.email" type="email" name="email" class="form-control" id="login" placeholder="example@login.com">
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input [(ngModel)]="authRequest.password" type="password" name="password" class="form-control" id="password" placeholder="secret1">
  </div>
  <div>
    <div class="d-flex justify-content-between mb-3">
      <button (click)="login()" type="button" class="btn btn-primary">
        <em class="fas fa-sign-in-alt">&nbsp;Sign in</em>
      </button>
    </div>
    <div>
      Don't have an account? &nbsp;
      <button (click)="register()" type="button" class="btn btn-link">
        <em class="fas fa-register-in-alt">&nbsp;Register</em>
      </button>
    </div>
  </div>
</div>
