<main class="auth-card" [class.auth-card--busy]="submitting()">
  <section class="brand">
    <img class="logo" src="images/whole-cine-logo.png" alt="CineGrade" width="512" height="170" />
    <h1 class="title">Forgot your password?</h1>
  </section>

  <section class="panel">
    @if (sent()) {
      <div class="notice notice--ok" role="status">
        <p>If an account uses that email, a reset link is on its way. It works for 15 minutes.</p>
      </div>
    }
    @if (errorMsg()) {
      <div class="notice" role="alert">
        <p>{{ errorMsg() }}</p>
      </div>
    }

    <form class="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="label" for="email">Email</label>
        <input
          class="input"
          [class.input--invalid]="emailError()"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          [(ngModel)]="email"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          aria-describedby="email-message"
        />
        <div id="email-message">
          @if (emailError()) {
            <p class="field-error">{{ emailError() }}</p>
          } @else {
            <p class="hint">We'll send a link to choose a new password.</p>
          }
        </div>
      </div>

      <div class="actions">
        <button class="submit" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
            Sending
          } @else if (sent()) {
            Send again
          } @else {
            Send reset link
          }
        </button>
        <p class="switch">Remembered it? <a class="link" routerLink="/login">Back to sign in</a></p>
      </div>
    </form>
  </section>
</main>
