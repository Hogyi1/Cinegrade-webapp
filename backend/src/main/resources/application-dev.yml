spring.application.name: boot-network-api

#MySQL Configuration
spring.datasource.url: jdbc:mysql://localhost:3306/credentials
spring.datasource.username: root
spring.datasource.password: root
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: false
spring.jpa.hibernate.ddl-auto: update
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.database: mysql


# Mailing
spring.mail.host: localhost
spring.mail.port: 1025
spring.mail.username: root
spring.mail.password: root
spring.mail.properties.mail.smtp.trust: "*"
spring.mail.properties.mail.smtp.auth: true
spring.mail.properties.mail.smtp.starttls.enable: true
spring.mail.properties.mail.smtp.connectiontimeout: 5000
spring.mail.properties.mail.smtp.timeout: 3000
spring.mail.properties.mail.smtp.writetimeout: 5000

#Extra properties
application.security.jwt.secret-key: njVfytLJ1Tjcn+yBa4kA3RhiRO+gXnvPOl1pAaC5HGA==l1pAaC5Ha4kA3Rh
application.security.jwt.expiration: 86400000
application.security.mailing.frontend.activation-url: http://localhost:4200/activate-account 


#OpenApi
springdoc.api-docs.enabled: true
springdoc.swagger-ui.enabled: true
springdoc.override-with-generic-response: false

server.port: 8080
server.ssl.enabled: false
