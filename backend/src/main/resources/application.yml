# Közös beállítások minden környezethez (dev és prod).
# A titkok (jelszavak, JWT kulcs) környezeti változókból jönnek, NEM ebből a fájlból.
#
# IntelliJ-ből indítva: a repo gyökerében lévő .env-ből olvassa ki, melyik környezet aktív
# (APP_ENV=dev vagy prod), majd betölti a .env.dev vagy .env.prod fájlt.
# (A backend/ és a gyökér mappában is keres, attól függően, honnan indul.)
# Dockerben a compose.yml adja át ugyanezeket környezeti változóként.

spring:
  application:
    name: cinegrade-api
  config:
    import:
      # A Spring a dokumentumokat HÁTULRÓL előre dolgozza fel, ezért kell ennek ELŐRÉBB lennie,
      # mint a .env importjának: így az APP_ENV már ismert, amikor ez a sor kiértékelődik.
      - "optional:file:.env.${APP_ENV:dev}[.properties]"
      - "optional:file:../.env.${APP_ENV:dev}[.properties]"
---
spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
---
spring:
  profiles:
    active: ${APP_ENV:dev}

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # E-mail küldés (dev: Mailpit, prod: valódi SMTP szolgáltató)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 900000
    mailing:
      from: ${MAIL_FROM:no-reply@cinegrade.local}
      frontend:
        activation-url: ${FRONTEND_URL:http://localhost:4200}/activate-account
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  files:
    upload-dir: ${FILES_UPLOAD_DIR:uploads}
  max-activation-attempts: ${MAX_ACTIVATION_ATTEMPTS:5}
  secure: ${SECURE:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  override-with-generic-response: false
  default-produces-media-type: application/json

server:
  port: 8080
  servlet:
    context-path: /api/v1/
  # A Caddy/nginx proxy mögött is a helyes (https) címeket lássa
  forward-headers-strategy: framework
